[package]
name = "advanced-table"
version = "0.1.0"
edition = "2021"
 
[dependencies]
iced = { version = "0.15.0-dev", features = [
    "advanced",
    "debug"
] }

[dev-dependencies]
# Drives `UserInterface` headlessly so the per-event cost can be timed without
# a window or a GPU.
iced_runtime = { version = "0.15.0-dev" }

# `iced` is asked for by version above and pointed at a source here, so nothing
# about where it comes from is baked into the dependency itself. A consumer can
# aim this at another branch, a fork, or a local checkout without this crate
# knowing, and every crate in the graph asking for `iced 0.15.0-dev` follows —
# which is what keeps `Element` and `Theme` one type across all of them. Pinning
# the same `rev` in every crate was the old way of getting that, and it meant
# the whole graph had to move in lockstep.
#
# 0.15 is unreleased, so this block is not optional: cargo cannot resolve
# `iced 0.15.0-dev` from crates.io without it. And cargo only honours `[patch]`
# in the manifest of the workspace being built, so a crate that depends on this
# one needs its own copy.
[patch.crates-io]
iced = { git = "https://github.com/iced-rs/iced.git", branch = "master" }
iced_runtime = { git = "https://github.com/iced-rs/iced.git", branch = "master" }

# Release codegen, but with `debug_assertions` left on: iced's null renderer
# (`impl Renderer for ()`) is gated on it, and `examples/event_bench.rs` needs
# that to drive the widget without a GPU. Measuring at opt-level 1 would put
# the numbers an order of magnitude off.
[profile.measure]
inherits = "release"
debug-assertions = true

[profile.dev]
opt-level = 1
 
[profile.dev.package."*"]
opt-level = 3